name: build_tools self test

on:
  push:
    branches:
      - 'ci/**'
      - 'ci-**'
      - 'dev'
      - 'master'
      - 'feat/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - 'dev'

jobs:
  self-test:
    runs-on: ${{ matrix.os }}
    # The loong64 images carry their own qemu and the runner cannot point its
    # binfmt handlers at it, so those two jobs report without gating.
    continue-on-error: ${{ startsWith(matrix.arch, 'loong64') }}

    # Same architecture/platform coverage as the vender repository: the self
    # test builds the minimal repositories in tests/ with the toolchain of each
    # target (Linux cross toolchains, alpine, android, Windows, macOS, iOS), so a
    # build_tools change can be validated without updating vender.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: linux
            type: release
          - os: ubuntu-latest
            arch: x64
            target: linux
            type: debug
          - os: ubuntu-latest
            arch: ia32
            target: linux
            type: release
          - os: ubuntu-latest
            arch: arm64
            target: linux
            type: release
          - os: ubuntu-latest
            arch: arm
            target: linux
            type: release
          - os: ubuntu-latest
            arch: mips64
            target: linux
            type: release
          - os: ubuntu-latest
            arch: ppc64
            target: linux
            type: release
          - os: ubuntu-latest
            arch: riscv64
            target: linux
            type: release
          - os: ubuntu-latest
            arch: loong64
            target: linux
            type: release
          - os: ubuntu-latest
            arch: loong64ow
            target: linux
            type: release
          - os: ubuntu-latest
            arch: x64
            target: alpine
            type: release
          - os: ubuntu-latest
            arch: ia32
            target: alpine
            type: release
          - os: ubuntu-latest
            arch: arm64
            target: alpine
            type: release
          - os: ubuntu-latest
            arch: x64
            target: android
            type: release
          - os: ubuntu-latest
            arch: ia32
            target: android
            type: release
          - os: ubuntu-latest
            arch: arm64
            target: android
            type: release
          - os: ubuntu-latest
            arch: arm
            target: android
            type: release
          # Without a target the entry script builds on the runner itself, and
          # tests/run.sh then also drives the repository of case A (the layout
          # of vender/fibjs), which the target based jobs skip: they only run
          # the entry case.
          - os: ubuntu-latest
            arch: x64
            target: ''
            type: release
          - os: ubuntu-latest
            arch: x64
            target: ''
            type: debug
          - os: windows-latest
            arch: x64
            target: win32
            type: release
          - os: windows-latest
            arch: ia32
            target: win32
            type: release
          - os: windows-latest
            arch: arm64
            target: win32
            type: release
          - os: macos-latest
            arch: x64
            target: darwin
            type: release
          - os: macos-latest
            arch: arm64
            target: darwin
            type: release
          - os: macos-latest
            arch: x64
            target: darwin
            type: debug
          - os: macos-latest
            arch: arm64
            target: iphone
            type: release
          - os: macos-latest
            arch: arm64
            target: iphone-simulator
            type: release

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      # Registers the binfmt handlers so that the cross architecture build
      # images (arm, arm64, mips64, ppc64, riscv64) can run on the x64 runner.
      # The action only supports Linux runners, which is all that needs it.
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      # Cross builds are dispatched into the fibjs build images by
      # build_env.sh, exactly like vender and fibjs do it; native runners use
      # their own toolchain.  Both layouts in tests/ are exercised, and the
      # artifacts are checked under bin/<OS>_<ARCH>_<TYPE>.
      - name: Self test
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          TYPE: ${{ matrix.type }}
        run: bash tests/run.sh

      # The raw log of a failed job needs authentication; these groups and the
      # annotations emitted by tests/run.sh are readable through the API.
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          for log in tests/work/*.log; do
            [ -f "${log}" ] || continue
            echo "::group::${log}"
            tail -60 "${log}"
            echo "::endgroup::"
            tail -5 "${log}" | while IFS= read -r line; do
              [ -n "${line}" ] && echo "::error::${line}"
            done
          done
